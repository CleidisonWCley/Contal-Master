<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #FFF9FF; background-color: #100B1F; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

/* V0.14.2 - Tela de carregamento UNIFICADA com a LoadingScreen.tscn do jogo.
   Mesmo fundo (degrade BG -> BG+30% roxo), mesmo logo, engrenagem girando com nucleo fixo,
   barra de trilho BRANCO + preenchimento ROXO + %, e as mesmas dicas.
   Assim o jogador ve UMA tela so: shell (download) -> LoadingScreen (cena), sem "troca" visual.
   Cores = UiPalette (BG #100B1F, PRIMARY #8B3DFF, HIGHLIGHT #B66BFF, TEXT_ON_DARK #FFF9FF). */
#status { position: absolute; inset: 0; z-index: 10;
	background: linear-gradient(to bottom, #100B1F 0%, #29184F 100%);
	display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
	padding: 0 32px; box-sizing: border-box; visibility: hidden; opacity: 1; transition: opacity .35s ease; }
#status.fade { opacity: 0; pointer-events: none; }
#status-logo { width: min(380px, 100%); height: auto; display: block; }
#status-spinner { position: relative; width: 150px; height: 150px; }
#status-spinner img { position: absolute; inset: 0; width: 100%; height: 100%; }
#status-gear { animation: cm-spin 2.6s linear infinite; }
@keyframes cm-spin { to { transform: rotate(360deg); } }
#status-tip { width: min(560px, 100%); min-height: 56px; display: flex; align-items: center; justify-content: center;
	text-align: center; font-family: 'Noto Sans', Arial, sans-serif; font-size: 18px; color: #FFF9FF; transition: opacity .15s ease; }
#status-bar { width: min(560px, 100%); height: 24px; box-sizing: border-box; border-radius: 12px; background: #FFFFFF;
	border: 2px solid rgba(182, 107, 255, .55); overflow: hidden; display: none; }
#status-fill { width: 0%; height: 100%; background: #8B3DFF; border-radius: 12px; transition: width .12s linear; }
#status-percent { font-family: 'Noto Sans', Arial, sans-serif; font-size: 24px; color: #FFF9FF; min-height: 32px; display: none; }
#status-notice { display: none; background-color: #5b3943; border-radius: .5rem; border: 1px solid #9b3943; color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; line-height: 1.3; margin: 0 2rem; overflow: hidden;
	padding: 1rem; text-align: center; z-index: 1; }
@media (max-height: 520px) {
	#status { gap: 8px; }
	#status-logo { width: min(240px, 60vw); }
	#status-spinner { width: 80px; height: 80px; }
	#status-tip { min-height: 28px; font-size: 15px; }
	#status-percent { font-size: 18px; min-height: 22px; }
}
@media (prefers-reduced-motion: reduce) { #status-gear { animation: none; } }
		</style>

	const msg = document.createElement('div');
	msg.style.cssText = 'max-width:520px;font-size:18px;line-height:1.4;';
	msg.textContent = 'O navegador interrompeu os gr\u00e1ficos do jogo (pouca mem\u00f3ria de v\u00eddeo). As fases conclu\u00eddas est\u00e3o salvas. Recarregue para continuar.';
	const btn = document.createElement('button');
	btn.textContent = 'Recarregar';
	btn.style.cssText = 'font-size:20px;padding:12px 28px;border:0;border-radius:12px;background:#8B3DFF;color:#FFF9FF;cursor:pointer;';
	btn.addEventListener('click', function () { window.location.reload(); });
	box.appendChild(msg); box.appendChild(btn);
	document.body.appendChild(box);
}, true);


(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusPercent = document.getElementById('status-percent');
	const statusNotice = document.getElementById('status-notice');
	const statusTip = document.getElementById('status-tip');
	let initializing = true;
	let statusMode = '';
	let tipTimer = null;
	let hideFallback = null;

	// Mesmas dicas da LoadingScreen.gd (mantenha as duas listas iguais).
	const TIPS = [
		'Carregando papéis de trabalho...',
		'Revisando as conformidades da NBC PA 11...',
		'Checando evidências nos papéis de trabalho...',
		'Aline está inspecionando o seu rigor normativo...',
		'Natalia está preparando os cenários do Desvio Lógico...',
		'Consultando as normas do CFC e CVM...'
	];
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	statusTip.textContent = TIPS[tipIndex];
	function startTips() {
		if (tipTimer) { return; }
		tipTimer = setInterval(function () {
			statusTip.style.opacity = '0';
			setTimeout(function () {
				tipIndex = (tipIndex + 1) % TIPS.length;
				statusTip.textContent = TIPS[tipIndex];
				statusTip.style.opacity = '1';
			}, 160);
		}, 2600);
	}

	function hideOverlay() {
		if (!statusOverlay.isConnected || statusOverlay.classList.contains('fade')) { return; }
		if (tipTimer) { clearInterval(tipTimer); tipTimer = null; }
		if (hideFallback) { clearTimeout(hideFallback); hideFallback = null; }
		statusOverlay.classList.add('fade');
		setTimeout(function () { statusOverlay.remove(); }, 400);
	}
	// O jogo (LoadingScreen.gd) chama isto quando JA desenhou a primeira tela dele:
	// o overlay so some nesse momento, entao nao existe "buraco" entre as duas telas.
	window.cmShellReady = hideOverlay;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) { return; }
		if (mode === 'hidden') {
			initializing = false;
			// Rede de seguranca: se o jogo nao avisar em 4 s, tira o overlay mesmo assim.
			hideFallback = setTimeout(hideOverlay, 4000);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusPercent.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (mode === 'progress') { startTips(); }
		statusMode = mode;
	}
	function setStatusNotice(text) {
		while (statusNotice.lastChild) { statusNotice.removeChild(statusNotice.lastChild); }
		text.split('\n').forEach(function (line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.'));
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let reg;
			try { reg = navigator.serviceWorker.getRegistration(); } catch (err) { reg = Promise.reject(new Error('Service worker registration failed.')); }
			Promise.race([
				reg.then(function (r) { if (r != null) { return Promise.reject(new Error('Service worker already exists.')); } return r; }).then(function () { return engine.installServiceWorker(); }),
				new Promise(function (resolve) { setTimeout(function () { resolve(); }, 2000); }),
			]).then(function () { window.location.reload(); }).catch(function (err) { console.error('Error while registering service worker:', err); });
		} else {
			displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round(current / total * 100));
					statusFill.style.width = pct + '%';
					statusPercent.textContent = pct + '%';
				}
			},
		}).then(function () { setStatusMode('hidden'); }, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
