<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<style>
/* ContalMaster - shell web (substitui a tela cinza padrao do Godot).
   Cores = UiPalette: BG #100B1F, PRIMARY #8B3DFF, HIGHLIGHT #B66BFF, TEXT #FFF9FF. */
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #100B1F; color: #FFF9FF; overflow: hidden; touch-action: none;
       font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 16px; padding: 0 32px; box-sizing: border-box; visibility: hidden;
          background: linear-gradient(180deg, #100B1F 0%, #351A62 100%); }
#status-logo { width: min(380px, 80vw); height: auto; }
#spinner { position: relative; width: 150px; height: 150px; }
#spinner img { position: absolute; inset: 0; width: 100%; height: 100%; }
#gear { animation: spin 3s linear infinite; }   /* so a engrenagem gira; o nucleo ($) fica parado */
@keyframes spin { to { transform: rotate(360deg); } }
#status-text { font-size: 18px; font-weight: 600; text-align: center; min-height: 28px; }
#track { width: min(560px, 100%); height: 24px; background: #FFFFFF; border-radius: 12px; overflow: hidden;
         border: 2px solid rgba(182, 107, 255, 0.55); box-sizing: border-box; position: relative; }
#fill { height: 100%; width: 0%; background: #8B3DFF; border-radius: 12px; transition: width 0.15s linear; }
#track.indeterminate #fill { width: 35%; animation: slide 1.1s ease-in-out infinite alternate; transition: none; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
#percent { font-size: 30px; font-weight: 600; min-height: 40px; }
#notice { display: none; text-align: center; font-size: 17px; line-height: 1.5; max-width: 560px; }
#retry { display: none; font: inherit; font-size: 18px; font-weight: 600; color: #FFF9FF; background: #8B3DFF; cursor: pointer;
         border: 2px solid #FFFFFF; border-radius: 14px; padding: 12px 28px; }
#retry:hover { background: #B66BFF; }
@media (prefers-reduced-motion: reduce) { #gear, #track.indeterminate #fill { animation: none; } }
</style>
$GODOT_HEAD_INCLUDE
</head>

	</div>
	<div id="status-text">Baixando os arquivos do jogo...</div>
	<div id="track" class="indeterminate" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
	<div id="percent"></div>
	<div id="notice"></div>
	<button id="retry" type="button">Tentar novamente</button>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const track = document.getElementById('track');
	const fill = document.getElementById('fill');
	const percent = document.getElementById('percent');
	const notice = document.getElementById('notice');
	const retry = document.getElementById('retry');
	retry.addEventListener('click', function () { window.location.reload(); });

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) { return; }
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const failed = mode === 'notice';
		track.style.display = failed ? 'none' : 'block';
		percent.style.display = failed ? 'none' : 'block';
		statusText.style.display = failed ? 'none' : 'block';
		notice.style.display = failed ? 'block' : 'none';
		retry.style.display = failed ? 'inline-block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		notice.textContent = '';
		text.split('\n').forEach(function (line) {
			notice.appendChild(document.createTextNode(line));
			notice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice('Não foi possível carregar o jogo.\n' + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Não foi possível carregar o jogo. Verifique a conexão e tente de novo.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let registration;
			try {
				registration = navigator.serviceWorker.getRegistration();
			} catch (err) {
				registration = Promise.reject(new Error('Service worker registration failed.'));
			}
			// Instalar o service worker pode resolver o problema (cabecalhos de isolamento): recarrega se instalar sem erro.
			Promise.race([
				registration.then(function (reg) {
					if (reg != null) { return Promise.reject(new Error('Service worker already registered.')); }
					return reg;
				}).then(function () { return engine.installServiceWorker(); }),
				new Promise(function (resolve) { setTimeout(function () { resolve(); }, 2000); }),
			]).then(function () {
				window.location.reload();
			}).catch(function (err) {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'O navegador não tem os recursos necessários para rodar o jogo:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.floor((current / total) * 100));
					track.classList.remove('indeterminate');
					track.setAttribute('aria-valuenow', String(pct));
					fill.style.width = pct + '%';
					percent.textContent = pct + '%';
				} else {
					// Servidor nao informou o tamanho: barra "indeterminada" (vai e volta) em vez de travar em 0%.
					track.classList.add('indeterminate');
					percent.textContent = '';
				}
			},
		}).then(function () {
			setStatusMode('hidden');   // a partir daqui quem mostra o loading e a LoadingScreen do Godot
		}, displayFailureNotice);
	}
}());
</script>
