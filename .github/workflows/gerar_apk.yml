name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  export-apk:
    name: Compilar APK na Nuvem
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java e Assinatura Android (Keystore)
        run: |
          # Gera uma chave de desenvolvedor para o APK
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          # Diz ao Godot exatamente onde está a chave
          mkdir -p ~/.config/godot/
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Exportar APK usando Godot 4.5.1
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"
          presets_to_export: "Android"
          use_preset_export_path: true
          relative_project_path: "./"
          export_debug: true

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: APK-ContalMaster
          path: build/android/